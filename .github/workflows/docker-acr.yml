name: Docker Build and Push to ACR

on:
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.build-and-push.outputs.digest }}
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to push instead of latest; leave empty to use latest'
        required: false
        type: string

concurrency:
  group: acr-${{ inputs.source_revision || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: sudorouter.azurecr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get current date
        id: date
        run: echo "DATE=$(TZ='Asia/Shanghai' date +'%Y_%m%d_%H%M')" >>$GITHUB_OUTPUT

      - name: Resolve image tag
        id: image_tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            tag="$INPUT_IMAGE_TAG"
          else
            tag="latest"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SOURCE_REVISION=${{ inputs.source_revision || github.sha }}
          tags: |
            ${{ env.REGISTRY }}/new-api:${{ steps.image_tag.outputs.tag }}
            ${{ env.REGISTRY }}/new-api:${{ steps.date.outputs.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
